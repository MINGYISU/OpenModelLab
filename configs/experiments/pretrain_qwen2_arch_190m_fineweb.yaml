# Pre-training from scratch: a ~190M-parameter Qwen2-architecture model (117M of it is the tied
# 152k-vocab embedding; ~75M non-embedding) with random init on
# FineWeb-Edu with the raw PyTorch loop (DDP). Scaling sweep: vary hidden_size/num_hidden_layers.
#   NGPU=8 scripts/train.sh configs/experiments/pretrain_qwen2_arch_190m_fineweb.yaml
base: ../base.yaml
run: {name: pretrain-190m, output_dir: outputs/pretrain/qwen2-190m}
model:
  path: Qwen/Qwen2.5-0.5B          # config + tokenizer source; weights are NOT loaded
  init: scratch
  config_overrides:
    hidden_size: 768
    intermediate_size: 2048
    num_hidden_layers: 12
    num_attention_heads: 12
    num_key_value_heads: 4
    tie_word_embeddings: true
    max_position_embeddings: 2048
data:
  train: {hf: HuggingFaceFW/fineweb-edu, config: sample-10BT, split: train, streaming: true}
  max_length: 1024
  packing: true
train:
  stage: pretrain
  backend: loop
  max_steps: 20000                 # 8 GPUs * 16 * 4 * 1024 tokens/step ~= 0.5M -> ~10B tokens
  per_device_batch_size: 16
  grad_accum: 4
  lr: 6.0e-4
  weight_decay: 0.1
  scheduler: wsd
  warmup_steps: 1000
  decay_ratio: 0.2
  min_lr_ratio: 0.1
  logging_steps: 20
  save_steps: 2000
  dataloader_num_workers: 2
