[project]
name = "finetune-research"
version = "0.1.0"
description = "Small, reproducible experiments with LLM fine-tuning and embeddings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
    "torch==2.15.0",
    "transformers==5.23.0",
    "peft==0.21.3",
    "accelerate==1.15.0",
]

[project.scripts]
finetune = "finetune.cli:main"

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
