[project]
name = "openmodellab"
version = "0.2.0"
description = "OpenModelLab: reproducible research on open LLM architectures, training, and evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
ml = [
    "torch==2.15.0",
    "transformers==5.23.0",
    "peft==0.21.3",
    "accelerate==1.15.0",
    "datasets==5.2.0",
    "safetensors",
    "tensorboard",
]
rl = ["trl==1.18.0"]
dist = ["deepspeed==0.20.0"]
eval = ["lm-eval", "mteb"]
quant = ["bitsandbytes"]
flash = ["flash-attn"]

[project.scripts]
finetune = "finetune.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
