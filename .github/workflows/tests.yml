name: Tests

on:
  push:
    paths:
      - "src/finetune/**/*.py"
      - "tests/**/*.py"
      - "configs/**/*.yaml"
      - "examples/**/*.jsonl"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "scripts/**/*.sbatch"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/finetune/**/*.py"
      - "tests/**/*.py"
      - "configs/**/*.yaml"
      - "examples/**/*.jsonl"
      - "scripts/**/*.py"
      - "scripts/**/*.sh"
      - "scripts/**/*.sbatch"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra ml
      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests
